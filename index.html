<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cute Friendship Question ✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 24px;
      padding: 30px 20px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    }

    .photo-frame {
      width: 170px;
      height: 170px;
      margin: 0 auto 20px auto;
      border-radius: 50%;
      border: 5px solid #ff4757;
      overflow: hidden;
      box-shadow: 0 8px 15px rgba(0,0,0,0.1);
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .question {
      font-size: 1.3rem;
      color: #333;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 15px;
      position: relative;
    }

    .btn {
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-yes {
      background: #ff4757;
      color: white;
      box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
    }

    .btn-no {
      background: #e0e0e0;
      color: #555;
    }

    .result {
      display: none;
      margin-top: 20px;
      font-size: 1.2rem;
      color: #ff4757;
      font-weight: bold;
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="photo-frame">
      <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=500" alt="Besties" />
    </div>

    <div class="question" id="questionText">Will you be my bestie forever? 🥺💖</div>

    <div class="btn-group" id="btnContainer">
      <button class="btn btn-yes" onclick="sayYes()">YES! 💕</button>
      <button class="btn btn-no" id="noBtn" onclick="shrinkNo()">No 😜</button>
    </div>

    <div class="result" id="resultText">
      YAYYY! Best Friends Forever! 🥳🎉❤️
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <script>
    let noScale = 1;
    let yesScale = 1;

    function shrinkNo() {
      const noBtn = document.getElementById('noBtn');
      const yesBtn = document.querySelector('.btn-yes');
      
      noScale -= 0.25;
      yesScale += 0.15;

      if (noScale <= 0.1) {
        noBtn.style.display = 'none';
      } else {
        noBtn.style.transform = `scale(${noScale})`;
      }
      yesBtn.style.transform = `scale(${yesScale})`;
    }

    function sayYes() {
      document.getElementById('btnContainer').style.display = 'none';
      document.getElementById('questionText').style.display = 'none';
      document.getElementById('resultText').style.display = 'block';

      confetti({
        particleCount: 150,
        spread: 80,
        origin: { y: 0.6 }
      });
    }
  </script>

</body>
</html>
