<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Friendship Day ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4);
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
}

.container{
width:95%;
max-width:420px;
background:white;
border-radius:20px;
padding:20px;
box-shadow:0 15px 40px rgba(0,0,0,.2);
text-align:center;
position:relative;
overflow:hidden;
}

h1{
color:#ff4d6d;
margin-bottom:10px;
}

p{
color:#555;
margin-bottom:15px;
}

.envelope{
font-size:90px;
cursor:pointer;
transition:.5s;
animation:bounce 2s infinite;
}

@keyframes bounce{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-10px);}
}

.hidden{
display:none;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:1px solid #ddd;
font-size:16px;
}

button{
padding:12px 20px;
border:none;
border-radius:10px;
margin:8px;
font-size:16px;
cursor:pointer;
transition:.3s;
}

.yes{
background:#4CAF50;
color:white;
}

.no{
background:#ff4d6d;
color:white;
position:relative;
}

.share{
background:#2196F3;
color:white;
}

.gallery{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-top:20px;
}

.gallery img{
width:100%;
border-radius:10px;
height:120px;
object-fit:cover;
}

.hearts{
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
pointer-events:none;
overflow:hidden;
}

.heart{
position:absolute;
font-size:20px;
animation:float 6s linear infinite;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:1;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}
</style>
</head>

<body>

<div class="container">

<div class="hearts" id="hearts"></div>

<div id="page1">

<div class="envelope" onclick="openLetter()">💌</div>

<h1>Happy Friendship Day</h1>

<p>Tap the envelope to open your surprise ❤️</p>

</div>

<div id="page2" class="hidden">

<h1>Happy Friendship Day ❤️</h1>

<p>You are the best friend ever!</p>

<input id="name" placeholder="Enter your name">

<button onclick="saveName()">Continue</button>

<div id="wish"></div>

<hr style="margin:20px 0">

<h2>Memory Wall 🖼️</h2>

<div class="gallery">

<img src="https://picsum.photos/200?1">
<img src="https://picsum.photos/200?2">
<img src="https://picsum.photos/200?3">
<img src="https://picsum.photos/200?4">

</div>

<hr style="margin:20px 0">

<h2>One Cute Question ❤️</h2>

<p>Will you always be my best friend?</p>

<button class="yes" onclick="yesAnswer()">Yes ❤️</button>

<button class="no" id="noBtn">No 😅</button>

<br>

<button class="share" onclick="sharePage()">Share</button>

<audio id="music" loop>
<source src="friendship.mp3" type="audio/mpeg">
</audio>

</div>


<script>

// Open Letter
function openLetter(){
document.getElementById("page1").classList.add("hidden");
document.getElementById("page2").classList.remove("hidden");

let music=document.getElementById("music");
music.play().catch(()=>{});

createHearts();
}

// Save Name
function saveName(){
let name=document.getElementById("name").value.trim();

if(name==""){
name="My Best Friend";
}

document.getElementById("wish").innerHTML=
"<h3 style='color:#ff4d6d'>💖 Dear <b>"+name+
"</b>,<br>Thank you for being the best friend in my life. Happy Friendship Day! 🌸</h3>";
}

// YES Button
function yesAnswer(){

alert("🥰 Yay! Forever Friends ❤️");

confetti();

}

// Moving NO Button
const noBtn=document.getElementById("noBtn");

noBtn.addEventListener("mouseover",moveButton);
noBtn.addEventListener("touchstart",moveButton);

function moveButton(){

let x=Math.random()*220-110;

let y=Math.random()*220-110;

noBtn.style.transform=
"translate("+x+"px,"+y+"px)";
}

// Floating Hearts
function createHearts(){

setInterval(()=>{

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML=
["❤️","💖","💕","💗","💞"][Math.floor(Math.random()*5)];

heart.style.left=Math.random()*100+"%";

heart.style.fontSize=
(18+Math.random()*22)+"px";

heart.style.animationDuration=
(4+Math.random()*4)+"s";

document.getElementById("hearts").appendChild(heart);

setTimeout(()=>heart.remove(),7000);

},350);

}

// Simple Confetti
function confetti(){

for(let i=0;i<60;i++){

let c=document.createElement("div");

c.innerHTML="🎉";

c.style.position="fixed";

c.style.left=Math.random()*100+"vw";

c.style.top="-20px";

c.style.fontSize="24px";

c.style.transition="3s linear";

document.body.appendChild(c);

setTimeout(()=>{
c.style.top="110vh";
},20);

setTimeout(()=>{
c.remove();
},3200);

}

}

// Share
function sharePage(){

if(navigator.share){

navigator.share({

title:"Happy Friendship Day ❤️",

text:"A special Friendship Day surprise for you!",

url:location.href

});

}else{

alert("Sharing is not supported on this browser.");

}

}

</script>

</body>
</html>
